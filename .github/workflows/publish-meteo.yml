name: Publier Météo Villes

on:
  push:
    branches:
      - main
      - meteo
      - "claude/meteo-daily-report-*"
    paths:
      - "meteo/**"
      - ".github/workflows/publish-meteo.yml"
  schedule:
    # 5h30 UTC tous les jours : le rapport du jour est prêt tôt le matin
    # (Paris et Casablanca), avant les 15 jours de prévisions qu'il présente.
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Groupe dédié à ce site (indépendant de celui du Portfolio Tracker) : un
  # nouveau push annule un run en cours pour la même branche, sans toucher au
  # groupe de publication du dashboard portefeuille.
  group: pages-meteo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meteo
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Cache des packages R
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-packages-meteo-${{ runner.os }}-v1

      - name: Installer les packages R
        run: |
          Rscript -e '
            dir.create(Sys.getenv("R_LIBS_USER"), recursive = TRUE, showWarnings = FALSE)
            pkgs <- c("tidyverse", "httr2", "plotly", "DT", "rmarkdown")
            manquants <- setdiff(pkgs, rownames(installed.packages()))
            if (length(manquants) > 0) install.packages(manquants)
          '

      - name: Installer Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Rendre le dashboard météo
        run: quarto render

      # historique.rds est un cache persistant et incrémental (voir
      # R/pipeline_meteo.R) : chaque rendu ne télécharge que les jours
      # manquants depuis la dernière fois, au lieu de retélécharger les 86 ans
      # de réanalyses à chaque fois (ce qui sature vite l'API gratuite). Il
      # faut donc le committer pour que le rendu suivant reparte de là où
      # celui-ci s'est arrêté. « [skip ci] » évite de redéclencher ce
      # workflow en boucle (le push cible meteo/**).
      - name: Committer l'historique météo mis à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historique.rds
          if git diff --staged --quiet; then
            echo "historique.rds inchangé — rien à committer."
          else
            git commit -m "Mise à jour de l'historique météo [skip ci]"
            git push
          fi

      - name: Déployer sur la branche gh-pages (sous-dossier meteo/)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: meteo/docs
          destination_dir: meteo
          keep_files: true
          commit_message: "Publication du dashboard météo"
