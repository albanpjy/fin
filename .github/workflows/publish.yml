name: Publier le dashboard

on:
  push:
    branches:
      - main
      - claude/funny-lamport-i4z7se
  schedule:
    # 18h00 UTC du lundi au vendredi, après la clôture d'Euronext (17h30 Paris)
    - cron: "0 18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Cache des packages R
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-packages-${{ runner.os }}-v1

      - name: Installer les packages R
        run: |
          Rscript -e '
            dir.create(Sys.getenv("R_LIBS_USER"), recursive = TRUE, showWarnings = FALSE)
            pkgs <- c("tidyverse", "tidyquant", "plotly", "DT", "rmarkdown")
            manquants <- setdiff(pkgs, rownames(installed.packages()))
            if (length(manquants) > 0) install.packages(manquants)
          '

      - name: Installer Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Rendre le dashboard
        run: quarto render

      - name: Déployer sur la branche gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          commit_message: "Publication du dashboard"
