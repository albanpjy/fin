name: Publier le dashboard

on:
  push:
    branches:
      - main
      - fin
  schedule:
    # 18h00 UTC du lundi au vendredi, après la clôture d'Euronext (17h30 Paris)
    - cron: "0 18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Groupe par référence git (branche) : un nouveau push sur `main` annule
  # le run `main` en cours, mais PAS un run `fin` — sinon deux pushes quasi
  # simultanés sur main et fin s'annulaient mutuellement. Chaque branche a
  # sa file d'attente ; les deux publient le même contenu sur gh-pages.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Cache des packages R
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-packages-${{ runner.os }}-v1

      - name: Installer les packages R
        run: |
          Rscript -e '
            dir.create(Sys.getenv("R_LIBS_USER"), recursive = TRUE, showWarnings = FALSE)
            pkgs <- c("tidyverse", "tidyquant", "plotly", "DT", "rmarkdown")
            manquants <- setdiff(pkgs, rownames(installed.packages()))
            if (length(manquants) > 0) install.packages(manquants)
          '

      # Persiste l'arborescence TinyTeX (paquets LaTeX : koma-script, fontspec,
      # babel-french…) d'un run à l'autre : après le premier run, les paquets
      # sont restaurés en quelques secondes au lieu d'être re-téléchargés, ce
      # qui accélère le rendu ET supprime les aléas de téléchargement à la
      # volée. La clé dépend de rapport.qmd (nouveaux besoins LaTeX = nouveau
      # cache), avec repli sur le cache précédent comme base (restore-keys).
      - name: Cache de TinyTeX (paquets LaTeX)
        uses: actions/cache@v4
        with:
          path: ~/.TinyTeX
          key: tinytex-${{ runner.os }}-${{ hashFiles('rapport.qmd') }}
          restore-keys: tinytex-${{ runner.os }}-

      - name: Installer Quarto et TinyTeX (LaTeX pour le rapport PDF)
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      # Rafraîchit la base de paquets de tlmgr : évite les « no matching
      # packages » lors de l'installation à la volée des paquets LaTeX
      # (koma-script, fontspec, babel-french…) par Quarto. Best-effort.
      - name: Rafraîchir la base de paquets LaTeX (robustesse CI)
        run: tlmgr update --self || true

      - name: Rendre le dashboard et le rapport PDF
        run: quarto render

      # Archive quotidienne : une copie horodatée du rapport PDF est commitée
      # dans exports/ (branche main uniquement). Le « [skip ci] » du message
      # de commit empêche ce push de re-déclencher le workflow en boucle.
      - name: Archiver le rapport PDF du jour
        if: github.ref == 'refs/heads/main'
        run: |
          DATE=$(date +%F)
          mkdir -p exports
          cp docs/rapport.pdf "exports/portfolio-tracker_${DATE}.pdf"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports
          if git diff --staged --quiet; then
            echo "Rapport du jour déjà archivé à l'identique — rien à committer."
          else
            git commit -m "Archive du rapport PDF du ${DATE} [skip ci]"
            git push
          fi

      - name: Déployer sur la branche gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          commit_message: "Publication du dashboard"
