name: Publier le dashboard

on:
  push:
    branches:
      - main
      - fin
  schedule:
    # 18h00 UTC du lundi au vendredi, après la clôture d'Euronext (17h30 Paris)
    - cron: "0 18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Cache des packages R
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-packages-${{ runner.os }}-v1

      - name: Installer les packages R
        run: |
          Rscript -e '
            dir.create(Sys.getenv("R_LIBS_USER"), recursive = TRUE, showWarnings = FALSE)
            pkgs <- c("tidyverse", "tidyquant", "plotly", "DT", "rmarkdown")
            manquants <- setdiff(pkgs, rownames(installed.packages()))
            if (length(manquants) > 0) install.packages(manquants)
          '

      - name: Diagnostic tickers (temporaire)
        run: |
          Rscript -e '
            suppressMessages(library(tidyquant))
            candidats <- c("EWLD.PA", "EWLDA.PA", "WLD.PA",
                           "FR0010036962.PA", "F0GBR067L3.PA", "0P00000LU4.F")
            for (tk in candidats) {
              d <- tryCatch(tq_get(tk, from = Sys.Date() - 60), error = function(e) NULL)
              ok <- is.data.frame(d) && nrow(d) > 0 && any(!is.na(d$close))
              cat("DIAG", tk, ":",
                  if (ok) paste(sum(!is.na(d$close)), "cours, dernier =",
                                round(tail(na.omit(d$close), 1), 2)) else "AUCUNE DONNEE",
                  "\n")
            }'

      - name: Installer Quarto et TinyTeX (LaTeX pour le rapport PDF)
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Rendre le dashboard et le rapport PDF
        run: quarto render

      # Archive quotidienne : une copie horodatée du rapport PDF est commitée
      # dans exports/ (branche main uniquement). Le « [skip ci] » du message
      # de commit empêche ce push de re-déclencher le workflow en boucle.
      - name: Archiver le rapport PDF du jour
        if: github.ref == 'refs/heads/main'
        run: |
          DATE=$(date +%F)
          mkdir -p exports
          cp docs/rapport.pdf "exports/portfolio-tracker_${DATE}.pdf"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports
          if git diff --staged --quiet; then
            echo "Rapport du jour déjà archivé à l'identique — rien à committer."
          else
            git commit -m "Archive du rapport PDF du ${DATE} [skip ci]"
            git push
          fi

      - name: Déployer sur la branche gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          commit_message: "Publication du dashboard"
